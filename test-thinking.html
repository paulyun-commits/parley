<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Thinking Feature</title>
    <link rel="stylesheet" href="public/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 Test Thinking Feature</h1>
            <p>Testing the collapsible thinking sections</p>
        </header>
        
        <div class="main-layout">
            <div class="chat-container">
                <div class="chat-history" id="chatHistory">
                    <!-- Test messages will be added here -->
                </div>
                
                <button onclick="addTestMessage()">Add Test Message</button>
                <button onclick="clearMessages()">Clear</button>
            </div>
        </div>
    </div>

    <script>
        // Include only the necessary functions from the main script
        const chatHistory = document.getElementById('chatHistory');

        function processThinkTags(message) {
            const thinkRegex = /<think>([\s\S]*?)<\/think>/gi;
            let thinking = '';
            let content = message;
            
            const thinkMatches = message.match(thinkRegex);
            if (thinkMatches) {
                thinking = thinkMatches.map(match => {
                    return match.replace(/<\/?think>/gi, '').trim();
                }).join('\n\n');
                
                content = message.replace(thinkRegex, '').trim();
            }
            
            return { thinking, content };
        }

        function createThinkingSection(thinkingContent) {
            const thinkingWrapper = document.createElement('div');
            thinkingWrapper.className = 'thinking-section';
            
            const thinkingHeader = document.createElement('div');
            thinkingHeader.className = 'thinking-header';
            thinkingHeader.innerHTML = `
                <span class="thinking-icon">🧠</span>
                <span class="thinking-label">Thinking</span>
                <span class="thinking-toggle">▼</span>
            `;
            
            const thinkingContent_div = document.createElement('div');
            thinkingContent_div.className = 'thinking-content';
            thinkingContent_div.style.display = 'none';
            
            marked.setOptions({
                breaks: true,
                gfm: true
            });
            
            thinkingContent_div.innerHTML = marked.parse(thinkingContent);
            
            thinkingHeader.addEventListener('click', () => {
                const isHidden = thinkingContent_div.style.display === 'none';
                thinkingContent_div.style.display = isHidden ? 'block' : 'none';
                const toggle = thinkingHeader.querySelector('.thinking-toggle');
                toggle.textContent = isHidden ? '▲' : '▼';
                thinkingWrapper.classList.toggle('expanded', isHidden);
            });
            
            thinkingWrapper.appendChild(thinkingHeader);
            thinkingWrapper.appendChild(thinkingContent_div);
            
            return thinkingWrapper;
        }

        function addMessage(message, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender);
            
            const senderElement = document.createElement('div');
            senderElement.classList.add('sender');
            senderElement.textContent = sender.toUpperCase();
            
            const contentElement = document.createElement('div');
            contentElement.classList.add('content');
            
            if (sender === 'alpha' || sender === 'omega') {
                const processedMessage = processThinkTags(message);
                
                marked.setOptions({
                    breaks: true,
                    gfm: true
                });
                
                contentElement.innerHTML = marked.parse(processedMessage.content);
                
                if (processedMessage.thinking) {
                    const thinkingSection = createThinkingSection(processedMessage.thinking);
                    contentElement.insertBefore(thinkingSection, contentElement.firstChild);
                }
            } else {
                contentElement.textContent = message;
            }
            
            const timestampElement = document.createElement('div');
            timestampElement.classList.add('timestamp');
            timestampElement.textContent = new Date().toLocaleTimeString();
            
            messageElement.appendChild(senderElement);
            messageElement.appendChild(contentElement);
            messageElement.appendChild(timestampElement);
            
            chatHistory.appendChild(messageElement);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function addTestMessage() {
            const testMessage = `<think>
I need to solve this step by step.

First, let me understand what the user is asking for:
1. They want a mathematical solution
2. They need it explained clearly
3. I should show my work

Let me work through this problem:
- The equation is: 2x + 5 = 15
- Subtract 5 from both sides: 2x = 10  
- Divide by 2: x = 5

I should also provide a code example to demonstrate this.
</think>

To solve the equation **2x + 5 = 15**, I'll work through it step by step:

1. **Subtract 5 from both sides:**
   2x + 5 - 5 = 15 - 5
   2x = 10

2. **Divide both sides by 2:**
   x = 10 ÷ 2 = 5

Here's how you could verify this in Python:

\`\`\`python
# Verify the solution
x = 5
result = 2 * x + 5
print(f"2({x}) + 5 = {result}")
print(f"Is this equal to 15? {result == 15}")
\`\`\`

Therefore, **x = 5** is the solution.`;
            
            addMessage(testMessage, 'alpha');
        }

        function clearMessages() {
            chatHistory.innerHTML = '';
        }

        // Add initial test message
        addTestMessage();
    </script>
</body>
</html>
